[project]
name = "lambda-zerotrust-poc"
version = "0.1.0"
description = "Serverless REST API PoC with zero-trust architecture"
requires-python = ">=3.13"
dependencies = [
    "pydantic",
    "aws-lambda-powertools[all]",
    "boto3",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-mock",
    "moto[dynamodb,s3,lambda,apigateway,cognito-idp]",
    "ruff",
    "bandit",
    "pip-audit",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]

[tool.bandit]
exclude_dirs = ["tests"]
confidence_threshold = "MEDIUM"
