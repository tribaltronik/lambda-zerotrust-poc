# Checkov baseline configuration
# Policy: fail the build on ANY check not explicitly skipped below.
# Skips are intentional, documented PoC tradeoffs (see docs/spec.md "Out of Scope").

quiet: true
skip-check:
  # Lambda: no VPC by design (spec.md §7: no VPC in scope; serverless-managed runtime)
  - CKV_AWS_117
  # Lambda: no SQS DLQ — async-invoke failures are the only DLQ use-case, API is sync (spec.md §7)
  - CKV_AWS_116
  # Lambda: no reserved concurrency — capacity/cold-start tradeoff deliberately left open (spec.md §6)
  - CKV_AWS_115
  # Lambda: code-signing profiles not part of the PoC pipeline
  - CKV_AWS_272
  # Lambda env vars + DynamoDB use AWS-managed KMS encryption (default), not a customer CMK — PoC cost tradeoff
  - CKV_AWS_173
  - CKV_AWS_119
  # API GW caching adds cost; PoC is low-traffic (spec.md §6)
  - CKV_AWS_120
  # CloudWatch log groups use AWS-managed KMS encryption (default), not a customer CMK — PoC cost tradeoff
  - CKV_AWS_158
  # REST API create-before-destroy: forces full re-creation; deployment resource already handles rollbacks
  - CKV_AWS_237
  # github_actions role trust policy: real deploy uses OIDC Federated principal scoped by aud/sub.
  # Flagi when scanned with use_localstack=true (root principal for the local emulator only).
  - CKV_AWS_61
  # --- New checks added by newer Checkov releases (validated against 3.2.470) ---
  # S3 state bucket (terraform/bootstrap/): single-region PoC, AWS-managed AES256 SSE;
  # a state backend has no cross-region replication / event-notification / lifecycle needs.
  - CKV_AWS_18
  - CKV_AWS_144
  - CKV_AWS_145
  - CKV2_AWS_61
  - CKV2_AWS_62
  # API GW: public REST API guarded by the Cognito authorizer + TLS at the edge;
  # WAF and mutual-TLS client certs are out of PoC scope (spec.md §7).
  - CKV2_AWS_29
  - CKV2_AWS_51
  # API GW stage logging level + request validation: access logs are already structured
  # JSON; full request/response logging is off to avoid capturing sensitive payloads, and
  # request validation is done in-handler with pydantic (spec.md §2).
  - CKV2_AWS_4
  - CKV2_AWS_53
